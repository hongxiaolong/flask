<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} - 宠物电商</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">宠物商城</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">首页</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/cart">购物车</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-6">
                {% if product.image_url %}
                    <img src="{{ product.image_url }}" class="img-fluid" alt="{{ product.name }}">
                {% else %}
                    <img src="https://via.placeholder.com/500x500" class="img-fluid" alt="{{ product.name }}">
                {% endif %}
            </div>
            <div class="col-md-6">
                <h1>{{ product.name }}</h1>
                <p class="lead">{{ product.description }}</p>
                <p class="h3 text-danger">¥{{ "%.2f"|format(product.price) }}</p>
                <p class="text-muted">分类: {{ product.category }}</p>
                <p class="text-muted">库存: {{ product.stock }} 件</p>
                
                <div class="mt-4">
                    <div class="row mb-3">
                        <div class="col-auto">
                            <label for="quantity" class="form-label">数量:</label>
                        </div>
                        <div class="col-auto">
                            <input type="number" id="quantity" class="form-control" value="1" min="1" max="{{ product.stock }}">
                        </div>
                    </div>
                    
                    <button id="add-to-cart-btn" class="btn btn-success btn-lg" data-product-id="{{ product.id }}">加入购物车</button>
                    <button class="btn btn-primary btn-lg ms-2">立即购买</button>
                </div>
            </div>
        </div>
        
        <div class="row mt-5">
            <div class="col-12">
                <h3>商品详情</h3>
                <p>{{ product.description }}</p>
            </div>
        </div>
    </div>

    <footer class="bg-light mt-5 py-4">
        <div class="container">
            <p class="text-center text-muted">&copy; 2023 宠物商城. 为您的爱宠提供最好的产品.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('add-to-cart-btn').addEventListener('click', function() {
            const productId = this.getAttribute('data-product-id');
            const quantity = parseInt(document.getElementById('quantity').value);
            
            // 发送请求到后端API
            fetch('/api/cart', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    product_id: productId,
                    quantity: quantity
                })
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    alert('已成功加入购物车！');
                } else {
                    alert('添加到购物车失败，请重试。');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('添加到购物车时出现错误，请重试。');
            });
        });
    </script>
</body>
</html>
